services:
  - type: web
    name: epm-payroll-suite
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start -w apps/api
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: JWT_SECRET
        generateValue: true
      - key: WEB_ORIGIN
        value: "*"
